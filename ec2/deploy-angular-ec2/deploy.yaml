name: Deploy Angular App

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

# -----------------------------------------------------------------------------
# Change these to match your project.
# APP_NAME must match the project name in your angular.json file —
# it determines the build output path: dist/APP_NAME/browser/
# -----------------------------------------------------------------------------
env:
  APP_NAME: your-app-name
  NODE_VERSION: '20'

jobs:

  # ---------------------------------------------------------------------------
  # Step 1 — Install dependencies and cache them for the build job
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Cache node_modules
      uses: actions/cache/save@v4
      with:
        path: node_modules
        key: node-modules-${{ hashFiles('package-lock.json') }}

  # ---------------------------------------------------------------------------
  # Step 2 — Build the Angular app in production mode
  # ---------------------------------------------------------------------------
  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Restore node_modules
      uses: actions/cache/restore@v4
      with:
        path: node_modules
        key: node-modules-${{ hashFiles('package-lock.json') }}

    - name: Build Angular app
      run: npx ng build --configuration production

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: dist/${{ env.APP_NAME }}/browser/
        retention-days: 1

  # ---------------------------------------------------------------------------
  # Step 3 — Zip the build output into a deployment package
  # ---------------------------------------------------------------------------
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: build/

    - name: Create deployment package
      run: |
        cd build
        zip -r ../${{ env.APP_NAME }}.zip .

    - name: Upload deployment package
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package
        path: ${{ env.APP_NAME }}.zip
        retention-days: 1

  # ---------------------------------------------------------------------------
  # Step 4 — Upload the package to S3
  # Stores a versioned copy (date + commit SHA) and overwrites latest/
  # so the EC2 instance always pulls the most recent build
  # ---------------------------------------------------------------------------
  upload-to-s3:
    needs: package
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Download deployment package
      uses: actions/download-artifact@v4
      with:
        name: deployment-package

    - name: Upload to S3
      run: |
        VERSION=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}
        aws s3 cp ${{ env.APP_NAME }}.zip \
          "s3://${{ secrets.S3_BUCKET_NAME }}/${{ env.APP_NAME }}/${VERSION}/${{ env.APP_NAME }}.zip"
        aws s3 cp ${{ env.APP_NAME }}.zip \
          "s3://${{ secrets.S3_BUCKET_NAME }}/${{ env.APP_NAME }}/latest/${{ env.APP_NAME }}.zip"

  # ---------------------------------------------------------------------------
  # Step 5 — Pull the package from S3 onto the EC2 instance via SSM
  # Waits for the SSM command to complete before moving on
  # ---------------------------------------------------------------------------
  deploy-to-ec2:
    needs: upload-to-s3
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to EC2 via SSM
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --parameters '{
            "commands": [
              "cd /usr/share/nginx/html",
              "rm -rf *",
              "aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/${{ env.APP_NAME }}/latest/${{ env.APP_NAME }}.zip .",
              "unzip -o ${{ env.APP_NAME }}.zip",
              "rm ${{ env.APP_NAME }}.zip",
              "chown -R nginx:nginx /usr/share/nginx/html"
            ]
          }' \
          --query "Command.CommandId" \
          --output text)

        echo "SSM Command ID: $COMMAND_ID"

        aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

        STATUS=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
          --query "Status" \
          --output text)

        echo "Deploy status: $STATUS"

        if [ "$STATUS" != "Success" ]; then
          echo "Deployment failed with status: $STATUS"
          exit 1
        fi

  # ---------------------------------------------------------------------------
  # Step 6 — Restart Nginx to serve the updated files
  # ---------------------------------------------------------------------------
  restart-nginx:
    needs: deploy-to-ec2
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Restart Nginx
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --parameters '{
            "commands": [
              "systemctl restart nginx",
              "systemctl status nginx"
            ]
          }' \
          --query "Command.CommandId" \
          --output text)

        aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

        STATUS=$(aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
          --query "Status" \
          --output text)

        echo "Nginx restart status: $STATUS"

        if [ "$STATUS" != "Success" ]; then
          echo "Nginx restart failed with status: $STATUS"
          exit 1
        fi